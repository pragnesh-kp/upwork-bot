name: Scheduler

# Calls the bot's /api/cron. On Hostinger the server also searches by itself every 5 minutes, so this
# is a backup. Each call continues a running search, or starts one for every
# filter whose 30 minutes (SEARCH_INTERVAL_MINUTES) have passed.
#
# Needs the repository secret CRON_SECRET (Settings → Secrets and variables → Actions),
# with the same value as CRON_SECRET on the server (Hostinger app environment variables).
#
# GitHub drops many scheduled runs when it is busy (on 29 Oct 2026 only 6 of 48 ran), worst at
# :00 and :30. So it asks every 10 minutes at odd minutes; a call when nothing is due does nothing.
# For dependable scans also add an external caller (cron-job.org), see DEPLOY.md step 6.

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

concurrency:
  group: scheduler
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://upwork.pelicanstechnologies.com
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the repository secret CRON_SECRET (Settings → Secrets and variables → Actions), same value as on the server (Hostinger)."
            exit 1
          fi
          code=$(curl -sS -m 90 -o body.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron")
          cat body.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::/api/cron answered HTTP $code. 401 means CRON_SECRET here differs from the one on the server."
            exit 1
          fi
